services:
  autoc:
    container_name: AutoC
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    networks:
      - autoc-net

  nginx: # Optional Nginx service
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - autoc
    networks:
      - autoc-net
    restart: unless-stopped

networks:
  autoc-net:
    driver: bridge